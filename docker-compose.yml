services:
  # Frontend (Next.js)
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped
    networks:
      - workflows-network

  # Backend (Express)
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=file:/app/database/dev.db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:-super-secret-key}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-encryption-secret-key}
    volumes:
      - workflows-db:/app/database
      - workflows-logs:/app/logs
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - workflows-network

  # Redis for Queue & Cache
  redis:
    image: redis:7-alpine
    command: redis-server --save 60 1 --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - workflows-network

networks:
  workflows-network:
    driver: bridge

volumes:
  workflows-db:
  workflows-logs:
  redis-data:
